[project]
name = "docintel"
version = "0.1.0"
description = "Multimodal document intelligence: cross-page retrieval with region-level citations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "docling>=2.7.0",
    "chromadb>=0.5.5",
    "sentence-transformers>=3.1.0,<4.0.0",
    "transformers>=4.41.0,<5.0.0",
    "structlog>=24.4.0",
    "groq>=0.11.0",
    "google-genai>=1.0.0",
    "tenacity>=9.0.0",
    "pymupdf>=1.24.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
